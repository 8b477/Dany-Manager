<!-- Overlay -->
<div
	id="loginModal"
	data-open="{{ open_modal == 'loginModal' ? '1' : '0' }}"
	class="fixed inset-0 z-100 hidden items-center justify-center">
	<!-- Backdrop -->
	<div id="loginBackdrop" class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>

	<!-- Modal -->
	<div class="relative z-10 w-full max-w-md mx-4 border border-primary/30 bg-surface p-8 code-shadow">
		<!-- Header -->
		<div class="flex justify-between items-center mb-8">
			<h2 class="text-2xl font-headline font-black tracking-tighter neon-text-blue uppercase">Connexion</h2>
			<button
				id="closeLoginModal"
				class="text-on-surface-variant hover:text-error transition-colors w-12 h-12 flex items-center justify-center hover:cursor-pointer rounded-full hover:bg-error/10">
				<span>X</span>
			</button>
		</div>

		<!-- Form -->
		<form id="loginForm" method="POST" action="/login">
			<div class="mb-6">
				<label class="block text-[10px] uppercase tracking-[0.3em] text-on-surface-variant mb-2 font-label" for="email">
					Email
				</label>
				<input
					id="email"
					type="email"
					name="email"
					required
					class="w-full px-4 py-3 bg-surface-container border border-outline text-on-surface font-body text-sm focus:border-primary focus:outline-none focus:glow-primary transition-all"
					placeholder="user@mail.dev" />
			</div>

			<div class="mb-8">
				<label
					class="block text-[10px] uppercase tracking-[0.3em] text-on-surface-variant mb-2 font-label"
					for="password">
					Mot de passe
				</label>
				<input
					id="password"
					type="password"
					name="password"
					required
					class="w-full px-4 py-3 bg-surface-container border border-outline text-on-surface font-body text-sm focus:border-primary focus:outline-none focus:glow-primary transition-all"
					placeholder="••••••••" />
			</div>

			<div class="flex items-center justify-center mb-8 h-4">
				<label
					class="text-[13px] underline underline-offset-2 pe-2 uppercase tracking-[0.3em] text-on-surface-variant font-label font-extrabold hover:text-secondary hover:cursor-pointer transition-colors"
					for="remember_me">
					Se souvenir de moi
				</label>
				<input
					id="remember_me"
					type="checkbox"
					name="remember_me"
					value="1"
					class="bg-surface-container border border-outline text-on-surface font-body text-sm focus:border-primary focus:outline-none focus:glow-primary transition-all" />
			</div>

			<!-- Error message slot -->
			<div
				id="loginError"
				class="{{ login_errors is defined and login_errors|length ? 'mb-4 px-4 py-2 border border-error bg-error/10 text-error text-xs font-label' : 'hidden mb-4 px-4 py-2 border border-error bg-error/10 text-error text-xs font-label' }}">
				{% if login_errors is defined and login_errors|length %} {% for error in login_errors %}
				<p>{{ error }}</p>
				{% endfor %} {% endif %}
			</div>
			<button
				type="submit"
				class="w-full py-4 bg-primary text-on-primary font-bold uppercase tracking-tighter text-sm hover:bg-secondary hover:text-white hover:cursor-pointer transition-all neon-border-blue hover:neon-border-magenta active:translate-y-1">
				Accéder au système
			</button>
		</form>

		<p class="mt-6 text-center text-xs text-on-surface-variant">
			Pas de compte ?
			<button id="toggleRegisterModal" class="text-secondary hover:text-primary transition-colors hover:cursor-pointer">
				Inscription
			</button>
		</p>
	</div>
</div>
